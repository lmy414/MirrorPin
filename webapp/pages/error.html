<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传与参数 · MirrorPin 拼豆图纸生成器</title>
    <style id="theme-vars">
:root {
  --brand-prefix: "mirrorpin";

  /* Primary hue: warm coral */
  --mirrorpin-primary: #E85D4C;
  --mirrorpin-primary-50: #FEF2F0;
  --mirrorpin-primary-100: #FCE5E2;
  --mirrorpin-primary-200: #F9C9C3;
  --mirrorpin-primary-300: #F2A199;
  --mirrorpin-primary-400: #E85D4C;
  --mirrorpin-primary-500: #D1483E;
  --mirrorpin-primary-600: #B33A32;
  --mirrorpin-primary-700: #942F29;

  /* Neutral surfaces */
  --mirrorpin-background: #FAFAF8;
  --mirrorpin-foreground: #1F1F1F;
  --mirrorpin-card: #FFFFFF;
  --mirrorpin-card-foreground: #1F1F1F;
  --mirrorpin-popover: #FFFFFF;
  --mirrorpin-popover-foreground: #1F1F1F;

  /* Muted / secondary text */
  --mirrorpin-muted: #F2F2EF;
  --mirrorpin-muted-foreground: #6B6B6B;

  /* Borders and input */
  --mirrorpin-border: #E5E5E0;
  --mirrorpin-input: #E5E5E0;
  --mirrorpin-ring: #E85D4C;

  /* Primary foreground */
  --mirrorpin-primary-foreground: #FFFFFF;

  /* State colors */
  --mirrorpin-state-success: #2A9D58;
  --mirrorpin-state-warning: #D9781E;
  --mirrorpin-state-error: #DC2626;
  --mirrorpin-state-info: #2563EB;

  /* Radius scale */
  --mirrorpin-radius-xs: 2px;
  --mirrorpin-radius-sm: 4px;
  --mirrorpin-radius-md: 8px;
  --mirrorpin-radius-lg: 16px;
  --mirrorpin-radius-pill: 999px;

  /* Typography */
  --mirrorpin-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mirrorpin-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Semantic aliases expected by head contract */
  --background: var(--mirrorpin-background);
  --foreground: var(--mirrorpin-foreground);
  --card: var(--mirrorpin-card);
  --card-foreground: var(--mirrorpin-card-foreground);
  --popover: var(--mirrorpin-popover);
  --popover-foreground: var(--mirrorpin-popover-foreground);
  --primary: var(--mirrorpin-primary);
  --primary-foreground: var(--mirrorpin-primary-foreground);
  --muted: var(--mirrorpin-muted);
  --muted-foreground: var(--mirrorpin-muted-foreground);
  --border: var(--mirrorpin-border);
  --input: var(--mirrorpin-input);
  --ring: var(--mirrorpin-ring);
  --radius-sm: var(--mirrorpin-radius-sm);
  --radius-md: var(--mirrorpin-radius-md);
  --radius-lg: var(--mirrorpin-radius-lg);
}

html {
  font-family: var(--mirrorpin-font-sans);
  background: var(--mirrorpin-background);
  color: var(--mirrorpin-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.mirrorpin-heading {
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.mirrorpin-body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--mirrorpin-muted-foreground);
}

.mirrorpin-mono {
  font-family: var(--mirrorpin-font-mono);
  font-variant-numeric: tabular-nums;
}

    </style>
    <link rel="stylesheet" href="../app/styles.css">
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--mirrorpin-background); }
      .text-background { color: var(--mirrorpin-background); }
      .border-background { border-color: var(--mirrorpin-background); }
      .ring-background { --tw-ring-color: var(--mirrorpin-background); }
      .bg-foreground { background-color: var(--mirrorpin-foreground); }
      .text-foreground { color: var(--mirrorpin-foreground); }
      .border-foreground { border-color: var(--mirrorpin-foreground); }
      .ring-foreground { --tw-ring-color: var(--mirrorpin-foreground); }
      .bg-card { background-color: var(--mirrorpin-card); }
      .text-card { color: var(--mirrorpin-card); }
      .border-card { border-color: var(--mirrorpin-card); }
      .ring-card { --tw-ring-color: var(--mirrorpin-card); }
      .bg-card-foreground { background-color: var(--mirrorpin-card-foreground); }
      .text-card-foreground { color: var(--mirrorpin-card-foreground); }
      .border-card-foreground { border-color: var(--mirrorpin-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--mirrorpin-card-foreground); }
      .bg-popover { background-color: var(--mirrorpin-popover); }
      .text-popover { color: var(--mirrorpin-popover); }
      .border-popover { border-color: var(--mirrorpin-popover); }
      .ring-popover { --tw-ring-color: var(--mirrorpin-popover); }
      .bg-popover-foreground { background-color: var(--mirrorpin-popover-foreground); }
      .text-popover-foreground { color: var(--mirrorpin-popover-foreground); }
      .border-popover-foreground { border-color: var(--mirrorpin-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--mirrorpin-popover-foreground); }
      .bg-primary { background-color: var(--mirrorpin-primary); }
      .text-primary { color: var(--mirrorpin-primary); }
      .border-primary { border-color: var(--mirrorpin-primary); }
      .ring-primary { --tw-ring-color: var(--mirrorpin-primary); }
      .bg-primary-foreground { background-color: var(--mirrorpin-primary-foreground); }
      .text-primary-foreground { color: var(--mirrorpin-primary-foreground); }
      .border-primary-foreground { border-color: var(--mirrorpin-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--mirrorpin-primary-foreground); }
      .bg-muted { background-color: var(--mirrorpin-muted); }
      .text-muted { color: var(--mirrorpin-muted); }
      .border-muted { border-color: var(--mirrorpin-muted); }
      .ring-muted { --tw-ring-color: var(--mirrorpin-muted); }
      .bg-muted-foreground { background-color: var(--mirrorpin-muted-foreground); }
      .text-muted-foreground { color: var(--mirrorpin-muted-foreground); }
      .border-muted-foreground { border-color: var(--mirrorpin-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--mirrorpin-muted-foreground); }
      .bg-border { background-color: var(--mirrorpin-border); }
      .text-border { color: var(--mirrorpin-border); }
      .border-border { border-color: var(--mirrorpin-border); }
      .ring-border { --tw-ring-color: var(--mirrorpin-border); }
      .bg-input { background-color: var(--mirrorpin-input); }
      .text-input { color: var(--mirrorpin-input); }
      .border-input { border-color: var(--mirrorpin-input); }
      .ring-input { --tw-ring-color: var(--mirrorpin-input); }
      .bg-ring { background-color: var(--mirrorpin-ring); }
      .text-ring { color: var(--mirrorpin-ring); }
      .border-ring { border-color: var(--mirrorpin-ring); }
      .ring-ring { --tw-ring-color: var(--mirrorpin-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col">
  <div id="top" class="sr-only" aria-hidden="true">top</div>

  <header class="sticky top-0 z-50 w-full border-b border-border bg-card/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-6">
      <a href="./index.html" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-foreground">
        <i data-lucide="grid-3x3" class="h-5 w-5 text-primary"></i>
        MirrorPin
      </a>
      <span class="text-xs font-medium text-muted-foreground">浏览器本地版</span>
    </div>
  </header>

  <main class="flex-1 w-full">
    <div class="mx-auto max-w-3xl px-6 py-16">
      <section data-region="error state" class="mirrorpin-surface mirrorpin-section text-center">
        <div class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full" style="background-color: color-mix(in srgb, var(--mirrorpin-state-error) 12%, transparent);">
          <i data-lucide="circle-alert" class="h-12 w-12" style="color: var(--mirrorpin-state-error);"></i>
        </div>
        <h1 class="mirrorpin-heading text-2xl text-foreground mb-3">生成失败</h1>
        <p class="mirrorpin-body mb-6">图片尺寸过大或浏览器内存不足，无法完成计算。你可以尝试选择更小的板规、关闭抠白底，或换一张更小的图片。</p>
        <p class="text-sm text-muted-foreground mb-8">图片始终不会上传到服务器，所有问题只与本地设备有关。</p>
        <a href="./index.html" id="retry-generate" data-dom-id="retry-generate" class="mirrorpin-primary-button inline-flex items-center justify-center rounded-xl px-6 py-3 text-base font-semibold text-primary-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
          返回重试
        </a>
      </section>
    </div>
  </main>

  <footer class="mt-auto w-full border-t border-border bg-card py-6">
    <div class="mx-auto max-w-6xl px-6 text-center text-sm text-muted-foreground">
      全程本地计算，图片与图纸不上传到服务器；服务器不存储、不记录。
    </div>
  </footer>

  <a id="back-to-top" data-dom-id="back-to-top" href="#top" class="fixed bottom-6 right-6 flex h-10 w-10 items-center justify-center rounded-full bg-card text-foreground shadow-md border border-border transition-colors hover:bg-muted hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="回到顶部">
    <i data-lucide="arrow-up" class="h-5 w-5"></i>
  </a>

  <script type="module" src="../app/icons.mjs"></script>
  <script type="module" src="../app/main.mjs"></script>
</body>
</html>
