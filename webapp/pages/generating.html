<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>上传与参数 · MirrorPin 拼豆图纸生成器</title>
    <style id="theme-vars">
:root {
  --brand-prefix: "mirrorpin";

  /* Primary hue: warm coral */
  --mirrorpin-primary: #E85D4C;
  --mirrorpin-primary-50: #FEF2F0;
  --mirrorpin-primary-100: #FCE5E2;
  --mirrorpin-primary-200: #F9C9C3;
  --mirrorpin-primary-300: #F2A199;
  --mirrorpin-primary-400: #E85D4C;
  --mirrorpin-primary-500: #D1483E;
  --mirrorpin-primary-600: #B33A32;
  --mirrorpin-primary-700: #942F29;

  /* Neutral surfaces */
  --mirrorpin-background: #FAFAF8;
  --mirrorpin-foreground: #1F1F1F;
  --mirrorpin-card: #FFFFFF;
  --mirrorpin-card-foreground: #1F1F1F;
  --mirrorpin-popover: #FFFFFF;
  --mirrorpin-popover-foreground: #1F1F1F;

  /* Muted / secondary text */
  --mirrorpin-muted: #F2F2EF;
  --mirrorpin-muted-foreground: #6B6B6B;

  /* Borders and input */
  --mirrorpin-border: #E5E5E0;
  --mirrorpin-input: #E5E5E0;
  --mirrorpin-ring: #E85D4C;

  /* Primary foreground */
  --mirrorpin-primary-foreground: #FFFFFF;

  /* State colors */
  --mirrorpin-state-success: #2A9D58;
  --mirrorpin-state-warning: #D9781E;
  --mirrorpin-state-error: #DC2626;
  --mirrorpin-state-info: #2563EB;

  /* Radius scale */
  --mirrorpin-radius-xs: 2px;
  --mirrorpin-radius-sm: 4px;
  --mirrorpin-radius-md: 8px;
  --mirrorpin-radius-lg: 16px;
  --mirrorpin-radius-pill: 999px;

  /* Typography */
  --mirrorpin-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mirrorpin-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Semantic aliases expected by head contract */
  --background: var(--mirrorpin-background);
  --foreground: var(--mirrorpin-foreground);
  --card: var(--mirrorpin-card);
  --card-foreground: var(--mirrorpin-card-foreground);
  --popover: var(--mirrorpin-popover);
  --popover-foreground: var(--mirrorpin-popover-foreground);
  --primary: var(--mirrorpin-primary);
  --primary-foreground: var(--mirrorpin-primary-foreground);
  --muted: var(--mirrorpin-muted);
  --muted-foreground: var(--mirrorpin-muted-foreground);
  --border: var(--mirrorpin-border);
  --input: var(--mirrorpin-input);
  --ring: var(--mirrorpin-ring);
  --radius-sm: var(--mirrorpin-radius-sm);
  --radius-md: var(--mirrorpin-radius-md);
  --radius-lg: var(--mirrorpin-radius-lg);
}

html {
  font-family: var(--mirrorpin-font-sans);
  background: var(--mirrorpin-background);
  color: var(--mirrorpin-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.mirrorpin-heading {
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.mirrorpin-body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--mirrorpin-muted-foreground);
}

.mirrorpin-mono {
  font-family: var(--mirrorpin-font-mono);
  font-variant-numeric: tabular-nums;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--mirrorpin-background);
    --color-foreground: var(--mirrorpin-foreground);
    --color-card: var(--mirrorpin-card);
    --color-card-foreground: var(--mirrorpin-card-foreground);
    --color-popover: var(--mirrorpin-popover);
    --color-popover-foreground: var(--mirrorpin-popover-foreground);
    --color-primary: var(--mirrorpin-primary);
    --color-primary-foreground: var(--mirrorpin-primary-foreground);
    --color-muted: var(--mirrorpin-muted);
    --color-muted-foreground: var(--mirrorpin-muted-foreground);
    --color-border: var(--mirrorpin-border);
    --color-input: var(--mirrorpin-input);
    --color-ring: var(--mirrorpin-ring);
    --radius-sm: var(--mirrorpin-radius-sm);
    --radius-md: var(--mirrorpin-radius-md);
    --radius-lg: var(--mirrorpin-radius-lg);
  }
  @layer base {
    body { background: var(--mirrorpin-background); color: var(--mirrorpin-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-input { background-color: var(--mirrorpin-input); }

      .ring-input { --tw-ring-color: var(--mirrorpin-input); }
      .bg-ring { background-color: var(--mirrorpin-ring); }
      .text-ring { color: var(--mirrorpin-ring); }
      .border-ring { border-color: var(--mirrorpin-ring); }
      .ring-ring { --tw-ring-color: var(--mirrorpin-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body class="min-h-screen font-sans antialiased flex flex-col">
  <div id="top" class="sr-only" aria-hidden="true">top</div>

  <header class="sticky top-0 z-50 w-full border-b border-border bg-card/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-6">
      <a href="./index.html" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-foreground">
        <i data-lucide="grid-3x3" class="h-5 w-5 text-primary"></i>
        MirrorPin
      </a>
      <a href="https://github.com/MirrorPin" target="_blank" rel="noopener noreferrer" class="text-muted-foreground hover:text-foreground transition-colors">
        <i data-lucide="github" class="h-5 w-5"></i>

  </main>

  <footer class="mt-auto w-full border-t border-border bg-card py-6">
    <div class="mx-auto max-w-6xl px-6 text-center text-sm text-muted-foreground">
      全程本地计算，图片与图纸不上传到服务器；服务器不存储、不记录。
    </div>

  <a id="back-to-top" data-dom-id="back-to-top" href="#top" class="fixed bottom-6 right-6 flex h-10 w-10 items-center justify-center rounded-full bg-card text-foreground shadow-md border border-border transition-colors hover:bg-muted hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="回到顶部">
    <i data-lucide="arrow-up" class="h-5 w-5"></i>
  </a>

  <style>
    .bead-dot {
      display: block;
      width: 0.625rem;
      height: 0.625rem;
      border-radius: 999px;
      background-color: var(--mirrorpin-primary);
      animation: bead-pulse 1.8s ease-in-out infinite;
      animation-delay: calc(var(--i) * 50ms);
    }
    @keyframes bead-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>
